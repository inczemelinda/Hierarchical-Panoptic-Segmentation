# Aggressive experiment with Swin-L backbone and tuned Tversky + boundary
# losses, smoke-test version.
# Full-training counterpart: exp_swinL_tversky.yaml.
#
# Combines: Swin-L backbone, Tversky alpha=0.2 beta=0.8 (more weed recall),
# higher boundary weight start (0.05 vs 0.01), lower inference thresholds
# (0.7 vs 0.8), RepeatFactorTrainingSampler, full augmentation (flip both +
# colour).
#
# MAX_ITER=50 — only confirms the pipeline boots, data loads, model forwards,
# AMP works, no OOM. Metrics from --eval-only will be near zero (50 iter is
# nowhere near enough to learn). Once verified, switch to exp_swinL_tversky.yaml
# for the real training run.
#
# Requires weights/edited_swin_lin21k.pkl (Swin-L ImageNet-21k pretrained,
# converted via tools/convert-pretrained-swin-model-to-d2.py).
_BASE_: swinl21k_2t_3l_bs4_300ep_deep_42seed.yaml
SEED: 42
MODEL:
  WEIGHTS: "weights/edited_swin_lin21k.pkl"
  MASK_FORMER:
    # --- Tversky tweak: push more recall on weed ---
    USE_TVERSKY_LOSS: True
    TVERSKY_WEIGHT: 3.0
    TVERSKY_ALPHA: 0.2          # was 0.3 — less FP penalty
    TVERSKY_BETA: 0.8           # was 0.7 — more FN penalty, more recall
    # --- Boundary weight starts higher (was 0.01) ---
    BOUNDARY_WEIGHT: 0.05
    USE_BOUNDARY_LOSS: True
    USE_FOCAL_LOSS: True
    # --- Inference thresholds lowered to recover small weed instances ---
    TEST:
      OBJECT_MASK_THRESHOLD: 0.7  # was 0.8
      OVERLAP_THRESHOLD: 0.7      # was 0.8
      PANOPTIC_ON: True
      SEMANTIC_ON: True
      INSTANCE_ON: False
      SEM_SEG_POSTPROCESSING_BEFORE_INFERENCE: True
SOLVER:
  AMP:
    ENABLED: True                # mandatory on RTX 4060 8 GB with Swin-L
  IMS_PER_BATCH: 1               # Swin-L barely fits at bs=1 + AMP on 8 GB
  MAX_ITER: 50                   # SMOKE TEST
  CHECKPOINT_PERIOD: 50          # save the smoke-test final
  STEPS: [45]                    # tiny LR decay just so the scheduler is hit
INPUT:
  IMAGE_SIZE: 768                # 1024 may OOM with Swin-L on 8 GB
  USE_FULL_AUG: True             # colour augmentations on
  RANDOM_FLIP: "both"            # horizontal + vertical flips
  FORMAT: "RGB"
DATALOADER:
  SAMPLER_TRAIN: "RepeatFactorTrainingSampler"   # oversample weed
  NUM_WORKERS: 0                                 # WSL2 shm safety
TEST:
  EVAL_PERIOD: 999999            # skip eval during the smoke test
RESIZE_AUG: False                # multi-scale dist_maps not generated
OUTPUT_DIR: output/Exp_SwinL_Tversky_TEST
