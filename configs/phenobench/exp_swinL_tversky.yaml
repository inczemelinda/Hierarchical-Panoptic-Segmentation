# swin-l experiment with the proposed additions, full training.
# smoke-test counterpart: exp_swinL_tversky_TEST.yaml.
#
# additions over the baseline: tversky loss (alpha=0.2, beta=0.8) for higher
# weed recall, higher initial boundary weight, lower inference thresholds,
# repeat-factor sampling and full augmentation (both-axis flip + colour).
#
# requires weights/edited_swin_lin21k.pkl (swin-l imagenet-21k pretrained,
# converted with tools/convert-pretrained-swin-model-to-d2.py).
_BASE_: swinl21k_2t_3l_bs4_300ep_deep_42seed.yaml
SEED: 42
MODEL:
  WEIGHTS: "weights/edited_swin_lin21k.pkl"
  MASK_FORMER:
    # tversky loss to emphasise recall on the rare weed class
    USE_TVERSKY_LOSS: True
    TVERSKY_WEIGHT: 3.0
    TVERSKY_ALPHA: 0.2          # false-positive weight (lower penalty)
    TVERSKY_BETA: 0.8           # false-negative weight (higher penalty, more recall)
    # higher initial boundary weight; a hook increases it during training
    BOUNDARY_WEIGHT: 0.05
    USE_BOUNDARY_LOSS: True
    USE_FOCAL_LOSS: True
    # lower inference thresholds to keep small weed instances
    TEST:
      OBJECT_MASK_THRESHOLD: 0.7
      OVERLAP_THRESHOLD: 0.7
      PANOPTIC_ON: True
      SEMANTIC_ON: True
      INSTANCE_ON: False
      SEM_SEG_POSTPROCESSING_BEFORE_INFERENCE: True
SOLVER:
  AMP:
    ENABLED: True                # mixed precision, required on 8 gb
  IMS_PER_BATCH: 1               # batch size limited by memory
  MAX_ITER: 15000
  CHECKPOINT_PERIOD: 3000        # checkpoints at 3k/6k/9k/12k/final
  STEPS: [13000]                 # learning-rate decay near the end of training
INPUT:
  IMAGE_SIZE: 768                # input resolution
  USE_FULL_AUG: True             # colour augmentations enabled
  RANDOM_FLIP: "both"            # horizontal and vertical flips
  FORMAT: "RGB"
DATALOADER:
  SAMPLER_TRAIN: "RepeatFactorTrainingSampler"   # oversample images with weed
  NUM_WORKERS: 0                                 # single-process loading (wsl2)
TEST:
  EVAL_PERIOD: 3000              # evaluation every 3000 iterations
RESIZE_AUG: False                # multi-scale distance maps not used
OUTPUT_DIR: output/Exp_SwinL_Tversky
